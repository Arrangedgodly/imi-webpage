<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Writing Room · Infinite Monkey Industries</title>
  <meta name="description" content="An incremental writing-room game: monkeys type letters, you turn them into words, write parody books, and sell the rights.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&family=Pixelify+Sans:wght@400;700&family=Silkscreen&family=Tiny5&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game.css">
</head>
<body>
  <div class="app">
    <header class="hud">
      <div class="money" title="Shared money from written titles"><span class="coin"></span><b id="money">$0</b></div>
      <div class="hud-mid" id="hudMid"></div>
      <div class="hud-links">
        <button type="button" id="soundBtn" class="mini" aria-pressed="true" title="Mechanical sound">SND</button>
        <a class="mini" href="library.html" title="The full manuscript library">ARCHIVE</a>
        <a class="mini" href="jungle.html" title="The old jungle control panel">JUNGLE</a>
      </div>
    </header>

    <nav class="room" id="room" aria-label="Writing room machines"></nav>

    <nav class="tabs" id="tabs" role="tablist" aria-label="Writing room screens">
      <button role="tab" data-tab="type">Type</button>
      <button role="tab" data-tab="upgrades">Upgrades</button>
      <button role="tab" data-tab="bank">Bank</button>
      <button role="tab" data-tab="library">Library</button>
      <button role="tab" data-tab="shop">Shop</button>
    </nav>

    <main>
      <section class="pane" id="pane-type" role="tabpanel"></section>
      <section class="pane" id="pane-upgrades" role="tabpanel" hidden></section>
      <section class="pane" id="pane-bank" role="tabpanel" hidden></section>
      <section class="pane" id="pane-library" role="tabpanel" hidden></section>
      <section class="pane" id="pane-shop" role="tabpanel" hidden></section>
    </main>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="readers.js"></script>
  <script src="game.js"></script>
</body>
</html>
